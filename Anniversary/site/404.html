<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page Not Found — Lagos Rhythm Anniversary Edition</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&amp;family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; padding: 6rem 1.25rem; text-align: center; }
  .nf__inner { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; max-width: 40rem; }
  .nf__code { font-family: var(--font-display); font-size: clamp(4rem, 16vw, 8rem); line-height: 1; color: var(--primary); letter-spacing: -0.04em; }
  .nf__rule { width: 4rem; height: 1px; background: var(--outline-variant); }
  .nf__actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
</style>
</head>
<body>
  <main class="nf">
    <div class="nf__inner">
      <span class="label label--md text-primary">Archive Error / 404</span>
      <span class="nf__code" aria-hidden="true">404</span>
      <span class="nf__rule" aria-hidden="true"></span>
      <h1 class="headline-lg">This folio isn’t in the archive</h1>
      <p class="body-lg" style="color: var(--on-surface-variant);">
        The page you were looking for has been reshelved. Return to the 1-Year Anniversary
        Special Edition, or head back to the main Lagos Rhythm site.
      </p>
      <div class="nf__actions">
        <a class="btn btn--primary" href="/">Back to the Edition</a>
        <a class="btn btn--ghost" href="https://lagosrhythm.com">Main Site</a>
      </div>
    </div>
  </main>
</body>
</html>
